<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="CWA Help Desk Appointment form">
  <meta name="keywords" content="CWA, Help Desk, Appointment, HTML Forms, Validation">
  <meta name="author" content="Brahmjot Singh">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CWA Help Desk Appointment</title>
</head>
<body>

  <!-- Clickable logo -->
  <p>
    <a href="https://www.swin.edu.au" target="_blank">
      <img src="logo.png" alt="Swinburne University of Technology" width="140">
    </a>
  </p>

  <h1>CWA Help Desk Appointment</h1>
  <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.</p>
  <p>Check Blackboard for when CWA tutors will be there.</p>

  <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php" novalidate>
    
    <!-- Student details -->
    <fieldset>
      <legend>Student details</legend>

      <div>
        <label for="studentId">Student ID</label>
        <input
          type="text"
          id="studentId"
          name="studentId"
          pattern="^\d{7,10}$"
          required
          placeholder="7–10 digits">
      </div>

      <div>
        <label for="givenName">Given Name</label>
        <input
          type="text"
          id="givenName"
          name="givenName"
          maxlength="15"
          pattern="^[A-Za-z]{1,15}$"
          required
          placeholder="Alphabetical only">
      </div>

      <div>
        <label for="familyName">Family Name</label>
        <input
          type="text"
          id="familyName"
          name="familyName"
          maxlength="15"
          pattern="^[A-Za-z]{1,15}$"
          required
          placeholder="Alphabetical only">
      </div>
    </fieldset>

    <!-- Unit & tutor -->
    <fieldset>
      <legend>Your unit</legend>

      <div>
        <input type="radio" id="u10011" name="unit" value="COS10011" required>
        <label for="u10011">COS10011</label>

        <input type="radio" id="u60004" name="unit" value="COS60004">
        <label for="u60004">COS60004</label>

        <input type="radio" id="u60007" name="unit" value="COS60007">
        <label for="u60007">COS60007</label>
      </div>

      <div>
        <label for="tutor">Your Tutor</label>
        <select id="tutor" name="tutor" required>
          <option value="">Please Select</option>
          <option>Brahmjot Singh</option>
          <option>Michael Palma</option>
          <option>Minh Tran</option>
          <option>Damien Loh</option>
          <option>Bob</option>
        </select>
      </div>
    </fieldset>

    <!-- Issue -->
    <fieldset>
      <legend>Issue</legend>
      <div>
        <input type="checkbox" id="iHTML" name="issue[]" value="HTML" checked="checked">
        <label for="iHTML">HTML</label>

        <input type="checkbox" id="iCSS" name="issue[]" value="CSS">
        <label for="iCSS">CSS</label>

        <input type="checkbox" id="iJS" name="issue[]" value="JavaScript">
        <label for="iJS">JavaScript</label>

        <input type="checkbox" id="iPHP" name="issue[]" value="PHP">
        <label for="iPHP">PHP</label>

        <input type="checkbox" id="iMySQL" name="issue[]" value="MySQL">
        <label for="iMySQL">MySQL</label>
      </div>

      <div>
        <label for="description">Description of Issue</label>
        <textarea id="description" name="description"
          placeholder="Write description of your problem here..."></textarea>
      </div>
    </fieldset>

    <!-- date/time -->
    <fieldset>
      <legend>Preferred Date / Time</legend>

      <div>
        <label for="date">Date</label>
        <input
          type="text"
          id="date"
          name="date"
          placeholder="dd/mm/yyyy"
          pattern="^\d{2}/\d{2}/\d{4}$">
      </div>

      <div>
        <label for="time">Time</label>
        <input
          type="text"
          id="time"
          name="time"
          placeholder="00:00"
          pattern="^([01]?[0-9]|2[0-3]):[0-5][0-9]$">
      </div>
    </fieldset>

    <div>
      <button type="submit">Book</button>
      <button type="reset">Reset form</button>
    </div>
  </form>

</body>
</html>
